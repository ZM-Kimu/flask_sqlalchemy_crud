[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlalchemy-crud-tx"
version = "2.2.1"
description = "Use SQLAlchemy in a Pythonic way."
readme = "README.md"
authors = [{ name = "ZMKimu" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0"]

[project.urls]
Homepage = "https://github.com/ZM-Kimu/sqlalchemy-crud-tx"

[project.optional-dependencies]
benchmark = ["pytest>=8.0", "pytest-benchmark>=4.0"]
asyncio = ["aiosqlite>=0.20", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$major.$minor.$patch"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
